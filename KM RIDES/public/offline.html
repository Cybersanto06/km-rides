<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <title>KM Rides | Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    body { min-height: 100vh; display: grid; place-items: center; background: #101828; color: #fff; padding: 24px; text-align: center; }
    .card { max-width: 340px; }
    .badge { display: inline-block; background: #fff; color: #101828; font-weight: 800; padding: 8px 14px; border-radius: 12px; margin-bottom: 24px; letter-spacing: -0.3px; }
    .badge span { color: #6b8f1d; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: #c9d1de; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    button { background: #c8f169; color: #101828; border: 0; border-radius: 14px; padding: 14px 28px; font-size: 16px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">KM <span>RIDES</span></div>
    <h1>You're offline</h1>
    <p>KM Rides needs a connection to find drivers. Check your data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
